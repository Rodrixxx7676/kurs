<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KURS — Rumbo al futuro</title>
  <base href="/" />
  <link rel="preload" id="webassembly" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.22.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" type="image/svg+xml" href="images/LogoSinFondo.svg" />
  <link href="KursFront.styles.css" rel="stylesheet" />
  <script type="importmap"></script>
</head>
<body>
  <div id="app">
    <div class="blazor-loading">
      <img src="images/LogoSinFondo.svg" class="loading-logo" alt="KURS" />
      <p class="loading-label">CARGANDO</p>
    </div>
  </div>
  <div id="blazor-error-ui">
    Error inesperado. <a href="." class="reload">Recargar</a>
    <span class="dismiss">✕</span>
  </div>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
  <script>
    // Registra la última actividad del usuario en localStorage.
    // AuthService lo lee para cerrar sesión por inactividad.
    (function () {
      const KEY = 'kurs_actividad';
      const eventos = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
      function actualizar() { localStorage.setItem(KEY, Date.now().toString()); }
      eventos.forEach(function (e) {
        document.addEventListener(e, actualizar, { passive: true });
      });
      actualizar();
    })();
  </script>
</body>
</html>
